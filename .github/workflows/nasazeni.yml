# Nasazení webu na Cloudflare.
#
# Proč to vzniklo: web se nasazoval ručně příkazem `wrangler deploy`
# z vývojového prostředí. Commit v repozitáři se tím pádem **nerovnal**
# tomu, co je na webu — a nikdo to nepoznal, dokud se nešel podívat.
#
# Workflow je bez tajemství **nečinné**: bez `CLOUDFLARE_API_TOKEN`
# a `CLOUDFLARE_ACCOUNT_ID` se zastaví hned v prvním kroku a napíše proč.
# Nic se tedy nenasadí omylem.
#
# Nastavení (jednou):
#   1. V Cloudflare vytvořte API token s oprávněním
#      „Workers Scripts: Edit" pro účet, kde web běží.
#   2. V GitHubu: Settings → Secrets and variables → ACTIONS → New secret
#      CLOUDFLARE_API_TOKEN  = ten token
#      CLOUDFLARE_ACCOUNT_ID = ID účtu z Cloudflare dashboardu
#
#      Pozor na záložku: „Codespaces“ je jiné úložiště. Tajemství
#      uložená tam se dostanou jen do Codespace, do běhu Actions nikdy.
#      V logu je to vidět jako `Secret source: Actions` a prázdné hodnoty.
#
# Token nikdy nepatří do repozitáře ani do zprávy — jen do tajemství.
#
# Nasazuje jen domovský repozitář `tessmickova/svetjmen`. Kopie projektu
# (a vznikly, viz docs/INCIDENT-2026-08-14.md) mají stejný soubor, ale
# podmínka `github.repository` je zastaví. Dva repozitáře nasazující týž
# Worker znamenají, že vyhraje ten, který doběhl později — a živý web
# může přepsat starší kód, aniž by to někdo poznal.

name: Nasazení na Cloudflare

on:
  # Ruční spuštění tlačítkem v záložce Actions.
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/animal-children-names-by-country-c014s6

# Souběžná nasazení by si přepisovala výsledek; novější vyhrává.
concurrency:
  group: nasazeni-${{ github.ref }}
  cancel-in-progress: true

env:
  DOMOVSKY_REPOZITAR: tessmickova/svetjmen

jobs:
  # Kopie repozitáře smí kód držet, ale nesmí nasazovat.
  jiny-repozitar:
    if: github.repository != 'tessmickova/svetjmen'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::Nasazení přeskočeno — tenhle repozitář (${{ github.repository }}) není domovský."
          echo "Projekt Svět jmen se nasazuje z ${{ env.DOMOVSKY_REPOZITAR }}."
          echo "Kdyby nasazovaly oba, přepisovaly by si navzájem živý web."

  nasadit:
    if: github.repository == 'tessmickova/svetjmen'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kontrola tajemství
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UCET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          chybi=""
          [ -z "$TOKEN" ] && chybi="$chybi CLOUDFLARE_API_TOKEN"
          [ -z "$UCET" ] && chybi="$chybi CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$chybi" ]; then
            echo "::error::Nasazení se nespustilo, chybí tajemství:$chybi"
            echo "Doplňte je v Settings → Secrets and variables → ZÁLOŽKA ACTIONS."
            echo "Záložka Codespaces je jiné úložiště — do běhu Actions se odtud nic nedostane."
            exit 1
          fi
          echo "Tajemství jsou nastavená."

      # Doména se ověřuje PŘED sestavením, ne až po nasazení.
      #
      # Adresa `svetjmen.cz` se zapéká do HTML jako kanonický odkaz a do
      # klientského kódu jako adresa reklamní služby. Kdyby doména
      # neodpovídala, vyhledávače by dostaly odkazy do prázdna a web by
      # neměl inzeráty — a poznalo by se to až na živém webu. Když tenhle
      # krok selže, nenasadí se nic a běží dál to, co běželo.
      #
      # Ověřuje se odsud, protože vývojové prostředí AI má vlastní
      # egress proxy, která cizí domény nepouští — 000 odtamtud neznamená
      # „doména neběží", ale „odsud se to nedá změřit".
      - name: Kontrola domény
        run: |
          spatne=""
          for adresa in https://svetjmen.cz https://www.svetjmen.cz https://reklama.svetjmen.cz/api/nastaveni; do
            kod=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$adresa" || echo 000)
            echo "$kod  $adresa"
            case "$kod" in 2*|3*) ;; *) spatne="$spatne $adresa($kod)" ;; esac
          done
          if [ -n "$spatne" ]; then
            echo "::error::Doména neodpovídá:$spatne — nasazení zastaveno."
            echo "Kód 000 = jméno se nepřeložilo: zóna svetjmen.cz nejspíš není v Cloudflare *Active*"
            echo "(jmenné servery u registrátora), nebo Worker nemá připojenou vlastní doménu."
            echo "Postup: docs/DOMENA.md"
            exit 1
          fi
          echo "Doména odpovídá, pokračuji."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      # Rozbitý web nemá cenu nasazovat rychle. Kontrola dat navíc zastaví
      # build sama, když se v katalogu objeví dvě jména se stejnou adresou.
      - name: Kontroly (typy, data, testy)
        run: npm run kontrola

      - name: Sestavení pro Cloudflare
        env:
          # Adresa reklamní služby se zapéká do klientského kódu při buildu.
          # Bez ní web ukazuje ukázkové inzeráty a /admin nemá na co sahat.
          NEXT_PUBLIC_ADS_API: https://reklama.svetjmen.cz
        run: npm run cf:build

      - name: Nasazení
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.jsonc

      # Reklamní služba se mění zřídka, ale když se změní, musí ven spolu
      # s webem — jinak /admin volá endpointy, které ještě neexistují.
      # Migrace je idempotentní (CREATE TABLE IF NOT EXISTS), smí běžet
      # opakovaně. Tajemství ADMIN_TOKEN tímhle nasazením nemizí —
      # wrangler secrets přežívají deploy.
      - name: Nasazení reklamní služby
        working-directory: ads-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          # `-c wrangler.toml` je nutné: po cf:build leží v kořeni repozitáře
          # přesměrování `.wrangler/deploy/config.json` (OpenNext) a wrangler
          # by ho odsud našel dřív — místo služby by podruhé nasadil web.
          #
          # Migrace jdou PŘED nasazením: nový kód se ptá na sloupce, které
          # bez nich v databázi nejsou, a dotazy by padaly. Pouštíme všechny
          # v pořadí podle názvu — každá je psaná tak, aby opakované spuštění
          # nevadilo, takže není potřeba nikde evidovat, co už proběhlo.
          #
          # Migrace potřebuje na tokenu oprávnění „D1: Edit". Když chybí,
          # nasazení zastavíme — nasadit kód bez jeho migrace je horší než
          # nenasadit nic. Ručně: cd ads-worker && npm run db:migrace
          for soubor in $(ls migrace/*.sql | sort); do
            echo "── migrace $soubor"
            if vystup=$(npx wrangler d1 execute svetjmen-ads --remote -c wrangler.toml --file="$soubor" 2>&1); then
              continue
            fi
            # Starší migrace mají `ALTER TABLE ADD COLUMN`, které se podruhé
            # neprovede. Že sloupec už existuje, je přesně to, čeho chceme
            # dosáhnout — na rozdíl od skutečné chyby to nasazení nezastaví.
            if echo "$vystup" | grep -qiE "duplicate column name|already exists"; then
              echo "   už bylo provedeno dřív, pokračuji"
              continue
            fi
            echo "$vystup"
            echo "::error::Migrace $soubor selhala. Nasazení reklamní služby zastaveno — kód bez své migrace by padal na chybějící sloupce."
            exit 1
          done
          npx wrangler deploy -c wrangler.toml
          # Ověření, že se opravdu nasadila služba, ne omylem web:
          sleep 5
          curl -sf https://reklama.svetjmen.cz/api/nastaveni | grep -q '"nastaveni"' \
            || { echo "::error::Reklamní služba po nasazení neodpovídá na /api/nastaveni."; exit 1; }

      # Ověření proti skutečně vydanému HTML — ne proti tomu, co jsme
      # sestavili. Kdyby nasazení proběhlo napůl, pozná se to tady.
      #
      # Opakuje se: Cloudflare rozváží nové soubory po světě a chvíli po
      # nasazení část adres ještě odpovídá ze starého vydání. Poprvé to
      # vypadalo jako šest rozbitých stránek a špatné canonical adresy —
      # přitom za minutu bylo všechno v pořádku. Jedno měření hned po
      # nasazení tedy nic nedokazuje.
      - name: Kontrola nasazeného webu
        run: |
          adresa=https://svetjmen.cz
          for pokus in 1 2 3; do
            echo "── pokus $pokus ─────────────────────────────"
            sleep 45
            if npm run kontrola:seo -- "$adresa"; then
              echo "Nasazený web je v pořádku (pokus $pokus)."
              exit 0
            fi
            echo "Ještě to nesedí, zkusíme to znovu."
          done
          echo "::error::Nasazený web neprošel kontrolou ani po třech pokusech."
          exit 1
