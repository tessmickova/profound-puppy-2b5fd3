# Nasazení webu na Cloudflare.
#
# Proč to vzniklo: web se nasazoval ručně příkazem `wrangler deploy`
# z vývojového prostředí. Commit v repozitáři se tím pádem **nerovnal**
# tomu, co je na webu — a nikdo to nepoznal, dokud se nešel podívat.
#
# Workflow je bez tajemství **nečinné**: bez `CLOUDFLARE_API_TOKEN`
# a `CLOUDFLARE_ACCOUNT_ID` se zastaví hned v prvním kroku a napíše proč.
# Nic se tedy nenasadí omylem.
#
# Nastavení (jednou):
#   1. V Cloudflare vytvořte API token s oprávněním
#      „Workers Scripts: Edit" pro účet, kde web běží.
#   2. V GitHubu: Settings → Secrets and variables → Actions → New secret
#      CLOUDFLARE_API_TOKEN  = ten token
#      CLOUDFLARE_ACCOUNT_ID = ID účtu z Cloudflare dashboardu
#
# Token nikdy nepatří do repozitáře ani do zprávy — jen do tajemství.

name: Nasazení na Cloudflare

on:
  # Ruční spuštění tlačítkem v záložce Actions.
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/animal-children-names-by-country-c014s6

# Souběžná nasazení by si přepisovala výsledek; novější vyhrává.
concurrency:
  group: nasazeni-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nasadit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kontrola tajemství
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UCET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          chybi=""
          [ -z "$TOKEN" ] && chybi="$chybi CLOUDFLARE_API_TOKEN"
          [ -z "$UCET" ] && chybi="$chybi CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$chybi" ]; then
            echo "::error::Nasazení se nespustilo, chybí tajemství:$chybi"
            echo "Doplňte je v Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Tajemství jsou nastavená."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      # Rozbitý web nemá cenu nasazovat rychle. Kontrola dat navíc zastaví
      # build sama, když se v katalogu objeví dvě jména se stejnou adresou.
      - name: Kontroly (typy, data, testy)
        run: npm run kontrola

      - name: Sestavení pro Cloudflare
        run: npm run cf:build

      - name: Nasazení
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.jsonc

      # Ověření proti skutečně vydanému HTML — ne proti tomu, co jsme
      # sestavili. Kdyby nasazení proběhlo napůl, pozná se to tady.
      - name: Kontrola nasazeného webu
        run: |
          sleep 15
          npm run kontrola:seo -- https://svetjmen.tereza-holtzerova.workers.dev
