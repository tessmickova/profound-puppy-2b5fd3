# Nasazení webu na Cloudflare.
#
# Proč to vzniklo: web se nasazoval ručně příkazem `wrangler deploy`
# z vývojového prostředí. Commit v repozitáři se tím pádem **nerovnal**
# tomu, co je na webu — a nikdo to nepoznal, dokud se nešel podívat.
#
# Workflow je bez tajemství **nečinné**: bez `CLOUDFLARE_API_TOKEN`
# a `CLOUDFLARE_ACCOUNT_ID` se zastaví hned v prvním kroku a napíše proč.
# Nic se tedy nenasadí omylem.
#
# Nastavení (jednou):
#   1. V Cloudflare vytvořte API token s oprávněním
#      „Workers Scripts: Edit" pro účet, kde web běží.
#   2. V GitHubu: Settings → Secrets and variables → ACTIONS → New secret
#      CLOUDFLARE_API_TOKEN  = ten token
#      CLOUDFLARE_ACCOUNT_ID = ID účtu z Cloudflare dashboardu
#
#      Pozor na záložku: „Codespaces“ je jiné úložiště. Tajemství
#      uložená tam se dostanou jen do Codespace, do běhu Actions nikdy.
#      V logu je to vidět jako `Secret source: Actions` a prázdné hodnoty.
#
# Token nikdy nepatří do repozitáře ani do zprávy — jen do tajemství.

name: Nasazení na Cloudflare

on:
  # Ruční spuštění tlačítkem v záložce Actions.
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/animal-children-names-by-country-c014s6

# Souběžná nasazení by si přepisovala výsledek; novější vyhrává.
concurrency:
  group: nasazeni-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nasadit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kontrola tajemství
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UCET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          chybi=""
          [ -z "$TOKEN" ] && chybi="$chybi CLOUDFLARE_API_TOKEN"
          [ -z "$UCET" ] && chybi="$chybi CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$chybi" ]; then
            echo "::error::Nasazení se nespustilo, chybí tajemství:$chybi"
            echo "Doplňte je v Settings → Secrets and variables → ZÁLOŽKA ACTIONS."
            echo "Záložka Codespaces je jiné úložiště — do běhu Actions se odtud nic nedostane."
            exit 1
          fi
          echo "Tajemství jsou nastavená."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      # Rozbitý web nemá cenu nasazovat rychle. Kontrola dat navíc zastaví
      # build sama, když se v katalogu objeví dvě jména se stejnou adresou.
      - name: Kontroly (typy, data, testy)
        run: npm run kontrola

      - name: Sestavení pro Cloudflare
        env:
          # Adresa reklamní služby se zapéká do klientského kódu při buildu.
          # Bez ní web ukazuje ukázkové inzeráty a /admin nemá na co sahat.
          NEXT_PUBLIC_ADS_API: https://svetjmen-ads.tereza-holtzerova.workers.dev
        run: npm run cf:build

      - name: Nasazení
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.jsonc

      # Reklamní služba se mění zřídka, ale když se změní, musí ven spolu
      # s webem — jinak /admin volá endpointy, které ještě neexistují.
      # Migrace je idempotentní (CREATE TABLE IF NOT EXISTS), smí běžet
      # opakovaně. Tajemství ADMIN_TOKEN tímhle nasazením nemizí —
      # wrangler secrets přežívají deploy.
      - name: Nasazení reklamní služby
        working-directory: ads-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          # Migrace potřebuje na tokenu oprávnění „D1: Edit". Když chybí,
          # nasazení nezastavíme — služba bez tabulky jede s výchozím
          # „vše zapnuto" a migraci jde pustit ručně: npm run db:migrace-003
          npx wrangler d1 execute svetjmen-ads --remote --file=./migrace/003-nastaveni.sql \
            || echo "::warning::Migrace D1 se nepovedla — tokenu nejspíš chybí oprávnění D1 Edit. Spusťte v ads-worker ručně: npm run db:migrace-003"
          npx wrangler deploy

      # Ověření proti skutečně vydanému HTML — ne proti tomu, co jsme
      # sestavili. Kdyby nasazení proběhlo napůl, pozná se to tady.
      #
      # Opakuje se: Cloudflare rozváží nové soubory po světě a chvíli po
      # nasazení část adres ještě odpovídá ze starého vydání. Poprvé to
      # vypadalo jako šest rozbitých stránek a špatné canonical adresy —
      # přitom za minutu bylo všechno v pořádku. Jedno měření hned po
      # nasazení tedy nic nedokazuje.
      - name: Kontrola nasazeného webu
        run: |
          adresa=https://svetjmen.tereza-holtzerova.workers.dev
          for pokus in 1 2 3; do
            echo "── pokus $pokus ─────────────────────────────"
            sleep 45
            if npm run kontrola:seo -- "$adresa"; then
              echo "Nasazený web je v pořádku (pokus $pokus)."
              exit 0
            fi
            echo "Ještě to nesedí, zkusíme to znovu."
          done
          echo "::error::Nasazený web neprošel kontrolou ani po třech pokusech."
          exit 1
